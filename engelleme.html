<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTIMATE SECURITY & DEFENSE NODE</title>
    <style>
        /* ==========================================================
           1. Katman: CSS Tabanlı Seçim, Sürükleme ve Kopyalama Kalkanı
           ========================================================== */
        * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
            -webkit-user-drag: none !important;
        }

        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: monospace, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .warning-box {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            max-width: 500px;
        }

        h1 { color: #38bdf8; font-size: 1.5rem; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="warning-box">
        <h1>GÜVENLİK DUVARI AKTİF</h1>
        <p>Bu sistem en üst düzey anti-debug ve anti-inspection protokolleri ile korunmaktadır. Kaynak kodlarına erişim ve kısayollar devre dışı bırakılmıştır.</p>
    </div>

    <script>
        /* ==========================================================
           2. Katman: Sağ Tık ve Bağlam Menüsü Engelleme
           ========================================================== */
        document.addEventListener('contextmenu', function(event) {
            event.preventDefault();
            event.stopPropagation();
            return false;
        }, true);

        /* ==========================================================
           3. Katman: Gelişmiş Klavye Kısayolu ve F12 Savunması
           ========================================================== */
        document.addEventListener('keydown', function(e) {
            // F12 tuşu
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }

            // Ctrl + Shift + I / J / C (Geliştirici Araçları Kombinasyonları)
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c' || e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }

            // Ctrl + U (Kaynak Kodunu Görüntüle)
            if (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.keyCode === 85)) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }

            // Ctrl + S (Sayfayı Kaydet)
            if (e.ctrlKey && (e.key === 'S' || e.key === 's' || e.keyCode === 83)) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }

            // Ctrl + A (Tümünü Seç)
            if (e.ctrlKey && (e.key === 'A' || e.key === 'a' || e.keyCode === 65)) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }

            // Ctrl + P (Yazdır / PDF Alarak Kaydetme Açığı)
            if (e.ctrlKey && (e.key === 'P' || e.key === 'p' || e.keyCode === 80)) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        }, true);

        /* ==========================================================
           4. Katman: Metin Seçimi, Kopyalama ve Sürükleme Blokajı
           ========================================================== */
        ['copy', 'cut', 'paste', 'selectstart', 'dragstart'].forEach(function(eventType) {
            document.addEventListener(eventType, function(e) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }, true);
        });

        /* ==========================================================
           5. Katman: Debugger (Hata Ayıklayıcı) Tuzak Döngüsü
           Geliştirici Konsolu açıldığında tarayıcıyı dondurur/kilitler.
           ========================================================== */
        (function() {
            try {
                function checkDevTools() {
                    const startTime = performance.now();
                    debugger; // Konsol açıksa burada duraklar ve zaman farkı açılır
                    const endTime = performance.now();
                    
                    if (endTime - startTime > 100) {
                        document.body.innerHTML = '<div style="background:#020617;color:#f43f5e;height:100vh;display:flex;justify-content:center;align-items:center;font-family:monospace;font-size:1.5rem;text-align:center;">GÜVENLİK İHLALİ TESPİT EDİLDİ!<br>Geliştirici Araçları Kapatılmalıdır.</div>';
                        window.location.reload();
                    }
                }
                setInterval(checkDevTools, 1000);
            } catch (err) {
                // Hata yakalama engeli
            }
        })();

        /* ==========================================================
           6. Katman: Pencere Boyutu Analizi (DevTools Yan Ekran Tespiti)
           ========================================================== */
        (function() {
            const threshold = 160;
            setInterval(function() {
                const widthThreshold = window.outerWidth - window.innerWidth > threshold;
                const heightThreshold = window.outerHeight - window.innerHeight > threshold;
                
                if (widthThreshold || heightThreshold) {
                    document.body.innerHTML = '<div style="background:#020617;color:#f43f5e;height:100vh;display:flex;justify-content:center;align-items:center;font-family:monospace;font-size:1.5rem;text-align:center;">PENCERE BOYUTU UYARI: İnceleme Paneli Algılandı!</div>';
                }
            }, 500);
        })();

        /* ==========================================================
           7. Katman: Konsol Nesnelerini Temizleme ve Maskeleme
           ========================================================== */
        (function() {
            if (window.console) {
                const noop = function() {};
                ['log', 'debug', 'info', 'warn', 'error', 'table', 'trace'].forEach(function(fn) {
                    try {
                        window.console[fn] = noop;
                    } catch (e) {}
                });
            }
        })();
    </script>
</body>
</html>
